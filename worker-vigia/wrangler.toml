# Vigia — card 3.10. Publicado pelo CI (.github/workflows/deploy-worker-vigia.yml),
# nunca à mão: o card 3.9 tirou o deploy do app das mãos e não faz sentido a
# infraestrutura que vigia esse app voltar a depender de alguém lembrar.

name = "gestao-im360-vigia"
main = "src/index.js"
compatibility_date = "2026-09-01"

# O Worker não tem por que ser alcançável da internet: quem o dispara é o cron, e
# o handler `fetch` existe só para conferência local com `wrangler dev`.
workers_dev = false

[triggers]
# 09:00 UTC = 06:00 em São Paulo (o Brasil não tem horário de verão desde 2019).
# Diário porque a pausa do free tier é por 7 dias sem atividade: uma vez por dia
# dá seis dias de folga para uma execução falhar sem consequência.
# Antes do expediente de propósito — o alerta chega a tempo de alguém agir antes
# de a escola tentar usar o sistema.
crons = ["0 9 * * *"]

# Bucket do backup diário do Fulcrum (card 3.12; desde 24/09/2026 no lugar do
# `gestao-im360-backup` do backup-semanal aposentado — docs/backup-restauracao.md).
# Só de LEITURA no uso do vigia — ele lista `gestaoim360/` para saber a idade e
# o tamanho da cópia mais nova e nada mais; não tem a senha e não abre a cópia.
#
# ⚠️ PRÉ-CONDIÇÃO DE DEPLOY: o bucket precisa EXISTIR NESTA CONTA Cloudflare,
# senão o `wrangler deploy` recusa o Worker. Isso é deliberado e é a forma do
# projeto: reprovar nomeando o que falta, em vez de publicar um vigia que não
# vigia. Enquanto o deploy novo não passar, o vigia JÁ PUBLICADO continua no ar
# sondando os dois Supabase — deploy que falha não derruba o que está rodando.
[[r2_buckets]]
binding = "BACKUP"
bucket_name = "fulcrum-backups"

[vars]
# Destinatário do alerta. Não é segredo: o mesmo endereço já está no seed em
# `parametro.direcao_inicial_email` (card 3.6), e o repositório é público.
ALERTA_PARA = "irineus@gmail.com"

# Secrets (nunca aqui — `wrangler secret put`, feito pelo CI):
#   SUPABASE_ANON_KEY_DEV   chave publicável do projeto de desenvolvimento
#   SUPABASE_ANON_KEY_PROD  chave publicável do projeto de produção
#   RESEND_API_KEY          chave da conta Resend do card 3.8
